name: Build Custom PGO Emulator

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Compiler
        uses: microsoft/setup-msbuild@v2

      - name: Install Glslang Tooling
        run: |
          choco install glslang -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Configure CMake Setup
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build with PGO Optimization
        run: cmake --build build --config Release -- /p:LinkTimeCodeGeneration=PGInstrument

      - name: Upload Optimized Executable
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-PGO-SurfaceBook
          path: build/Release/
